version: "3.9"

services:
  transport-service:
    build: .
    image: transport-service:latest
    container_name: transport-service
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/routes/')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped